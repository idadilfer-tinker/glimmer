<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Glimmer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#120d22; --plum:#241536; --card:rgba(26,16,44,.92);
  --gold:#e9d09b; --gold-deep:#c9a35c; --cream:#f8eedc; --muted:#b8a8c9; --rose:#f2a3c0; --sage:#8fd9b8;
  --sans:"Resist Sans","Resist Sans Text","Hanken Grotesk","Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,"Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
video#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
.hidden{display:none!important}

.screen{position:fixed;inset:0;display:flex;text-align:center;padding:24px;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 40%,rgba(18,13,34,.35),rgba(18,13,34,.82) 75%);z-index:10}
.hero{max-width:720px;margin:auto}
.screen>div:not(.hero){margin:auto}
.eyebrow{font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0 0 18px;font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(60px,min(11vw,16vh),138px);line-height:.95;margin:0 0 20px;color:var(--gold);letter-spacing:-.035em}
.lede{font-family:var(--serif);font-size:clamp(20px,min(2.2vw,3.2vh),28px);line-height:1.4;margin:0 auto 28px;max-width:620px;color:var(--cream);font-weight:400}
.btn{font-family:var(--sans);font-size:24px;font-weight:700;letter-spacing:.04em;color:var(--bg);background:var(--gold);
  border:0;border-radius:999px;padding:20px 64px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 40px rgba(233,208,155,.25)}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 14px 50px rgba(233,208,155,.4)}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid rgba(233,208,155,.55);box-shadow:none;font-size:18px;padding:12px 30px}
.btn.ghost:hover{background:rgba(233,208,155,.12)}
.row{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:22px}
.small{font-size:17px;line-height:1.55;color:var(--muted);max-width:560px;margin:22px auto 0}
.small span{display:block}
.lede,.small span,.hint{text-wrap:balance}
:lang(ja) .lede,:lang(ja) .small span{line-break:strict;word-break:normal;text-wrap:pretty}
:lang(ja) .eyebrow,:lang(ja) table.prog th,:lang(ja) .grp label{letter-spacing:.08em;text-transform:none}
:lang(ja) h1{letter-spacing:0}
:lang(tr) .eyebrow,:lang(tr) .grp label,:lang(tr) table.prog th{text-transform:none;letter-spacing:.1em}
.streak{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--rose);margin:0 0 26px;min-height:1em}
.spinner{width:54px;height:54px;border-radius:50%;border:3px solid rgba(233,208,155,.2);border-top-color:var(--gold);margin:0 auto 26px;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadMsg{font-family:var(--serif);font-size:28px;color:var(--cream);font-weight:400}

.iconbtn{position:fixed;top:14px;z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid rgba(233,208,155,.35);
  background:rgba(26,16,44,.82);color:var(--gold);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(233,208,155,.16)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#gear{right:14px} #fs{right:72px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card);border:1px solid rgba(233,208,155,.4);
  padding:14px 26px;border-radius:14px;font-size:18px;z-index:30;max-width:80vw;text-align:center;transition:opacity .4s}

#settings{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);border-left:1px solid rgba(233,208,155,.3);
  z-index:20;padding:26px 26px 40px;overflow:auto;background:rgba(26,16,44,.98)}
#settings h2{font-family:var(--serif);font-size:36px;margin:0 0 4px;color:var(--gold);font-weight:500;letter-spacing:-.02em}
#settings .sub{color:var(--muted);font-size:16px;margin:0 0 22px}
.grp{margin:0 0 20px}
.grp label{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:600 16px var(--sans);color:var(--cream);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  padding:10px 16px;min-height:44px;border-radius:999px;cursor:pointer}
.seg button:hover{background:rgba(255,255,255,.12)}
.seg button.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.hint{color:var(--muted);font-size:15px;margin:8px 0 0;line-height:1.45}
table.prog{width:100%;border-collapse:collapse;font-size:16px;margin-top:6px}
table.prog th{font-weight:600;color:var(--muted);text-align:left;padding:4px 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
table.prog td{padding:6px;border-top:1px solid rgba(255,255,255,.08)}
.langsw{margin-top:18px}
.langsw button{min-height:44px}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:4s}.btn{transition:none}#toast{transition:none}}
@media (max-height:700px){.screen{padding:14px}.eyebrow{margin-bottom:8px}h1{margin-bottom:10px}.lede{margin-bottom:14px}.streak{margin:0 0 10px;font-size:22px;min-height:0}.btn{padding:14px 52px}.btn.ghost{padding:10px 26px}.row{margin-top:12px}.langsw{margin-top:12px}.small{margin-top:12px;font-size:15px}}
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="Glimmer"></canvas>
<video id="cam" playsinline muted></video>

<button class="iconbtn hidden" id="gear" data-i18n-aria="aria.gear" aria-label="Settings">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<button class="iconbtn hidden" id="fs" data-i18n-aria="aria.fs" aria-label="Full screen">
  <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<main class="screen" id="welcome">
  <div class="hero">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1>Glimmer</h1>
    <p class="lede" id="welcomeLede"></p>
    <p class="streak" id="streak" aria-live="polite"></p>
    <button class="btn" id="begin" data-i18n="begin"></button>
    <div class="row"><button class="btn ghost" id="openSettings" data-i18n="settings"></button></div>
    <div class="seg langsw row" id="langSw" role="group" aria-label="Language"></div>
    <p class="small"><span data-i18n="small1"></span><span data-i18n="small2"></span></p>
  </div>
</main>

<div class="screen hidden" id="loading" role="status" aria-live="polite">
  <div><div class="spinner"></div><div id="loadMsg"></div></div>
</div>

<aside id="settings" class="hidden" role="dialog" aria-label="Settings">
  <h2 data-i18n="s.title"></h2>
  <p class="sub" data-i18n="s.sub"></p>
  <div id="opts"></div>
  <div class="grp"><label id="lblSetup" data-i18n="s.setup"></label>
    <div class="seg" role="group" aria-labelledby="lblSetup">
      <button id="btnCentre" data-i18n="s.centre"></button>
      <button id="btnRecal" data-i18n="s.recal"></button>
    </div>
    <p class="hint" data-i18n="s.centreHint"></p>
  </div>
  <div class="grp"><label data-i18n="s.last7"></label><div id="progress"></div></div>
  <div class="row" style="justify-content:flex-start"><button class="btn ghost" id="closeSettings" data-i18n="s.close"></button></div>
  <p class="hint" data-i18n="s.shortcuts"></p>
</aside>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script type="module">
// =====================================================================
// GLIMMER — a gentle, camera-controlled match-three for movement
// =====================================================================

// ---------- utilities ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const irand = n => Math.floor(Math.random() * n);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2;
// One neo-grotesque family for everything: Resist Sans if it is embedded or installed, otherwise Hanken Grotesk (a close free cousin)
const SANS = '"Resist Sans", "Resist Sans Text", "Hanken Grotesk", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, "Helvetica Neue", Arial, system-ui, sans-serif';
const SERIF = SANS;   // display text uses the same family (kept as a separate name so headings can be restyled later)
const COL = { gold: '#e9d09b', goldDeep: '#c9a35c', cream: '#f8eedc', muted: '#b8a8c9', rose: '#f2a3c0', sage: '#8fd9b8', ink: '#120d22' };

// ---------- storage (per-viewer, wrapped in try/catch) ----------
const KEY = 'glimmer.v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
store.days = store.days || {};
function saveStore() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* private mode etc. */ } }
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function dayStats(key = dayKey()) {
  const d = (store.days[key] = store.days[key] || { sec: 0, gems: 0, moves: 0 });
  for (const k of EX_KEYS) if (typeof d[k] !== 'number') d[k] = 0;
  return d;
}
const EX_KEYS = ['smile', 'kiss', 'brows', 'ahh', 'blink', 'turn', 'reach', 'loud', 'armup', 'shrug', 'hopen', 'taps'];
const exTotal = d => EX_KEYS.reduce((n, k) => n + (d[k] || 0), 0);
function streakCount() {
  let n = 0; const d = new Date();
  const ok = k => (store.days[k]?.sec || 0) >= 120;
  if (!ok(dayKey(d))) d.setDate(d.getDate() - 1);
  while (ok(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- settings ----------
const DEFAULTS = { control: 'hand', pick: 'grab', reach: 0, hold: 1, steady: 1, gems: 5, faces: 2, loud: true, loudLevel: 1, arms: true, hands: true, handPlay: 'switch', faceJewels: true, lang: 'tr', sound: true, voice: true, selfview: true };
const LOUD_DB = [12, 16, 22];                            // how far above the room's quiet she must get (dB)
const SETTINGS = Object.assign({}, DEFAULTS, store.settings || {});
const HOLD_SEC = [0.6, 0.9, 1.3];
const FACE_EVERY = [Infinity, 70, 45, 30];             // jewels cleared between exercises
const STEADY = [{ minCut: 3.0, beta: 3.0 }, { minCut: 1.6, beta: 2.0 }, { minCut: 0.9, beta: 1.2 }];
const MODE = {
  hand: { r: [0.55, 0.75, 0.95], vg: 1.25 },
  arm:  { r: [0.80, 1.05, 1.30], vg: 1.25 },
  head: { r: [0.16, 0.22, 0.30], vg: 1.8 },
  mouse: { r: [1, 1, 1], vg: 1 },
};

// ---------- One Euro filter (two stages) to calm tremor ----------
class LowPass { constructor() { this.y = null; } filter(x, a) { this.y = this.y == null ? x : a * x + (1 - a) * this.y; return this.y; } }
class OneEuro {
  constructor() { this.minCut = 1; this.beta = 1; this.dCut = 1; this.x = null; this.lp = new LowPass(); this.dlp = new LowPass(); }
  alpha(cut, dt) { const tau = 1 / (TAU * cut); return 1 / (1 + tau / dt); }
  filter(x, dt) {
    const dx = this.x == null ? 0 : (x - this.x) / dt; this.x = x;
    const ed = this.dlp.filter(dx, this.alpha(this.dCut, dt));
    return this.lp.filter(x, this.alpha(this.minCut + this.beta * Math.abs(ed), dt));
  }
  reset(x) { this.x = null; this.lp.y = null; this.dlp.y = null; if (x != null) this.filter(x, 1 / 60); }
}
class Smoother2D {
  constructor() { this.f = [new OneEuro(), new OneEuro(), new OneEuro(), new OneEuro()]; this.setLevel(SETTINGS.steady); }
  setLevel(i) { const s = STEADY[i]; this.f.forEach(f => { f.minCut = s.minCut; f.beta = s.beta; }); }
  step(u, v, dt) { return [this.f[2].filter(this.f[0].filter(u, dt), dt), this.f[3].filter(this.f[1].filter(v, dt), dt)]; }
  reset(u, v) { this.f.forEach(f => f.reset()); if (u != null) { this.f[0].reset(u); this.f[1].reset(v); this.f[2].reset(u); this.f[3].reset(v); } }
}

// ---------- sound: soft pentatonic chimes, all synthesised ----------
const Snd = {
  ctx: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = 0.3; this.master.connect(c.destination);
      const d = c.createDelay(); d.delayTime.value = 0.24; const fb = c.createGain(); fb.gain.value = 0.3; const wet = c.createGain(); wet.gain.value = 0.32;
      this.master.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(c.destination);
    } catch (e) { this.ctx = null; }
  },
  pent(i) { const sc = [0, 2, 4, 7, 9]; const m = 60 + sc[((i % 5) + 5) % 5] + 12 * Math.floor(i / 5); return 440 * Math.pow(2, (m - 69) / 12); },
  tone(freq, delay, dur, vol = 0.25, type = 'sine') {
    if (!this.ctx || !SETTINGS.sound) return;
    const c = this.ctx, t0 = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  pick() { this.tone(this.pent(9), 0, 0.35, 0.16); this.tone(this.pent(11), 0.07, 0.4, 0.12, 'triangle'); },
  swap() { this.tone(this.pent(3), 0, 0.18, 0.1, 'triangle'); },
  nope() { this.tone(this.pent(4), 0, 0.22, 0.09, 'triangle'); this.tone(this.pent(2), 0.1, 0.3, 0.08, 'triangle'); },
  chime(chain, n) {
    const notes = Math.min(3 + chain, 7), base = Math.min(chain * 2, 8);
    for (let i = 0; i < notes; i++) { this.tone(this.pent(base + i * 1 + 2), i * 0.07, 0.6, 0.15 + Math.min(n, 6) * 0.01); if (i % 2 === 0) this.tone(this.pent(base + i + 7) , i * 0.07 + 0.02, 0.5, 0.05, 'triangle'); }
  },
  fanfare() { [0, 2, 4, 7, 9, 12].forEach((s, i) => this.tone(this.pent(5 + i), i * 0.11, 1.1, 0.16)); this.tone(this.pent(3), 0, 1.6, 0.1, 'triangle'); },
  soft() { this.tone(this.pent(7), 0, 0.5, 0.1); this.tone(this.pent(9), 0.12, 0.6, 0.08); },
};

// ---------- gentle voice prompts ----------
let voiceObj = null, voiceLang = "";
function say(text) {
  try {
    if (!SETTINGS.voice || !window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices(), sp = LM().speech, pre = sp.slice(0, 2);
    if ((!voiceObj || voiceLang !== sp) && vs.length) { voiceLang = sp; voiceObj = vs.find(v => v.lang.replace('_', '-').toLowerCase() === sp.toLowerCase() && /female|serena|kate|martha|fiona|stephanie|yelda|kyoko|o-ren|nanami|filiz/i.test(v.name)) || vs.find(v => v.lang.replace('_', '-').toLowerCase() === sp.toLowerCase()) || vs.find(v => v.lang.toLowerCase().startsWith(pre)) || null; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = sp; u.rate = 0.88; u.pitch = 1.02; u.volume = 0.9; if (voiceObj) u.voice = voiceObj;
    speechSynthesis.speak(u);
  } catch (e) { /* voice is optional */ }
}
try { window.speechSynthesis && (speechSynthesis.onvoiceschanged = () => { voiceObj = null; }); } catch (e) {}

// ---------- tiny tween engine (driven by the main loop so pausing works) ----------
const tweens = [];
function tw(obj, props, dur, ease = easeInOut, delay = 0) {
  return new Promise(res => { const from = {}; for (const k in props) from[k] = obj[k]; tweens.push({ obj, props, from, dur, t: -delay, ease, res }); });
}
const wait = sec => tw({ _: 0 }, { _: 1 }, sec, x => x);
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const w = tweens[i]; w.t += dt; if (w.t < 0) continue;
    const p = Math.min(1, w.t / w.dur), e = w.ease(p);
    for (const k in w.props) w.obj[k] = w.from[k] + (w.props[k] - w.from[k]) * e;
    if (p >= 1) { tweens.splice(i, 1); w.res(); }
  }
}


// =====================================================================
// Languages: Turkish (default), English, Japanese
// =====================================================================
const LANG_META = {
  tr: { name: 'Türkçe', locale: 'tr-TR', speech: 'tr-TR', html: 'tr' },
  en: { name: 'English', locale: 'en-GB', speech: 'en-GB', html: 'en-GB' },
  ja: { name: '日本語', locale: 'ja-JP', speech: 'ja-JP', html: 'ja' },
};
const pl = (n, one, many) => n === 1 ? one : many;
const LANGS = {
  en: {
    eyebrow: 'A gentle movement game',
    lede: "Match the jewels with a sweep of your hand. Now and then, you'll be invited to smile, send a kiss, use your voice, or reach for a star.",
    begin: 'Begin', settings: 'Settings',
    small1: 'Please sit in a steady chair with your arms supported, and stop whenever you feel tired.',
    small2: 'Everything happens on this computer. The camera picture and microphone level are never saved or sent anywhere.',
    'load.cam': 'Waking the camera…', 'load.hand': 'Teaching the game to see your hands…', 'load.pose': 'Learning to see your shoulders…', 'load.mic': 'Listening for your voice…',
    'aria.gear': 'Settings (S)', 'aria.fs': 'Full screen (F)',
    's.title': 'Settings', 's.sub': 'For whoever is helping. Changes save automatically.', 's.setup': 'Set up', 's.centre': 'Centre me now', 's.recal': 'Redo face set-up',
    's.centreHint': '"Centre me" makes wherever the hand is right now the middle of the board. Shortcut: C.', 's.last7': 'Last 7 days', 's.close': 'Close',
    's.shortcuts': 'Shortcuts: Space pauses, S opens settings, F full screen, M switches to the mouse.', 's.lang': 'Language',
    'th.day': 'Day', 'th.moving': 'Moving', 'th.jewels': 'Jewels', 'th.ex': 'Exercises', 'unit.min': 'min',
    'on': 'On', 'off': 'Off',
    'opt.control': 'Move the pointer with', 'opt.control.hand': 'Hand', 'opt.control.arm': 'Whole arm', 'opt.control.head': 'Head', 'opt.control.mouse': 'Mouse',
    'opt.control.hint': 'Hand is the most precise. Whole arm suits a bigger movement from further back. Head is for when arms are tired.',
    'opt.pick': 'Pick up a jewel by', 'opt.pick.grab': 'Closing your hand', 'opt.pick.dwell': 'Holding still', 'opt.pick.kiss': 'Blowing a kiss', 'opt.pick.pinch': 'Pinching',
    'opt.pick.hint': 'Rest your open hand on a jewel, close it to grab, then move to a neighbouring jewel. Holding still needs no fine movement and copes well with a tremor.',
    'opt.reach': 'Reach size', 'opt.reach.0': 'Comfortable', 'opt.reach.1': 'Big', 'opt.reach.2': 'Extra big',
    'opt.reach.hint': 'How far the hand travels to cross the board. Larger is better exercise, so build up gradually.',

// ---------- arms and shoulders (pose) ----------
function poseMetrics(now) {
  const p = Pz.lm; if (!p || now - Pz.lastSeen > 1000) return null;

  const sy = (a.y + b.y) / 2;

  const arm = (wr, el, sh) => vis(wr) > .35 ? (sh.y - wr.y) / sw : vis(el) > .4 ? (sh.y - el.y) / sw * 1.2 : -1;

function finishSession() {

async function begin() {
  Snd.init(); $('#welcome').classList.add('hidden'); $('#loading').classList.remove('hidden'); S.mode = 'loading';
  const setMsg = m => { $('#loadMsg').textContent = m; };
  const wantsCam = SETTINGS.control !== 'mouse' || SETTINGS.pick !== 'dwell' || SETTINGS.faces > 0;
  if (wantsCam) {
    setMsg(t('load.cam'));
    try { await startCamera(); } catch (e) { console.warn(e); toast(t('t.cam')); }

      try { await loadModels(setMsg); } catch (e) { console.warn(e); toast(t('t.models')); }
      if (SETTINGS.control === 'arm') await ensurePose();
      else if (SETTINGS.arms && SETTINGS.faces > 0) { setMsg(t('load.pose')); await ensurePose(true); }
    }
    if (SETTINGS.loud && SETTINGS.faces > 0) {
      setMsg(t('load.mic'));

  const wanted = SETTINGS.control;
  if (SETTINGS.control === 'hand' && !S.models.hand) { SETTINGS.control = 'mouse'; }
  if (SETTINGS.control === 'head' && !S.models.face) { SETTINGS.control = 'mouse'; }
  if (SETTINGS.control === 'arm' && !S.models.pose) { SETTINGS.control = S.models.hand ? 'hand' : 'mouse'; }
  if (SETTINGS.pick === 'kiss' && !S.models.face) SETTINGS.pick = 'dwell';
  if (SETTINGS.pick === 'grab' && (!S.models.hand || SETTINGS.control === 'head')) SETTINGS.pick = 'dwell';
  if (SETTINGS.pick === 'pinch' && !S.models.hand) SETTINGS.pick = 'dwell';

  $('#loading').classList.add('hidden'); P.wasAbsent = true; S.activeHand = 'right'; S.swapped = false; H.wantSeen = performance.now(); H.fb = false; S.sessionSec = 0; S.sinceRest = 0; S.doneShown = false; T = dayStats();
  refreshSettingsUI(); startCalibrate();
}

// ---------- settings drawer ----------
const ONOFF = [[true], [false]];
const OPTIONS = [
  { key: 'lang', label: 's.lang', opts: Object.keys(LANG_META).map(k => [k, LANG_META[k].name]), raw: true },
  { key: 'control', opts: [['hand'], ['arm'], ['head'], ['mouse']], hint: 1 },
  { key: 'pick', opts: [['grab'], ['dwell'], ['kiss'], ['pinch']], hint: 1 },
  { key: 'reach', opts: [[0], [1], [2]], hint: 1 },
  { key: 'hold', opts: [[0], [1], [2]] },
  { key: 'steady', opts: [[0], [1], [2]], hint: 1 },
  { key: 'gems', opts: [[5], [6]] },
  { key: 'faces', opts: [[0], [1], [2], [3]] },
  { key: 'loud', opts: ONOFF, hint: 1 },
  { key: 'loudLevel', opts: [[0], [1], [2]] },
  { key: 'arms', opts: ONOFF, hint: 1 },
  { key: 'faceJewels', opts: ONOFF, hint: 1 },
  { key: 'hands', opts: ONOFF, hint: 1 },
  { key: 'handPlay', opts: [['switch'], ['right'], ['left'], ['any']], hint: 1 },
  { key: 'sound', opts: ONOFF },
  { key: 'voice', opts: ONOFF },
  { key: 'selfview', opts: ONOFF },
];
function refreshSettingsUI() {
  const box = $('#opts'); box.innerHTML = '';
  for (const o of OPTIONS) {
    const g = document.createElement('div'); g.className = 'grp'; const id = 'opt_' + o.key;
    g.innerHTML = `<label id="${id}"></label><div class="seg" role="group" aria-labelledby="${id}"></div>` + (o.hint ? '<p class="hint"></p>' : '');
    g.querySelector('label').textContent = t(o.raw ? o.label : 'opt.' + o.key); if (o.hint) g.querySelector('.hint').textContent = t('opt.' + o.key + '.hint');
    const seg = g.querySelector('.seg');
    for (const [val, name] of o.opts) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = name || t(typeof val === 'boolean' ? (val ? 'on' : 'off') : 'opt.' + o.key + '.' + val);
      if (o.raw) b.lang = LANG_META[val].html;
      const on = SETTINGS[o.key] === val; b.setAttribute('aria-pressed', on); if (on) b.className = 'on'; b.onclick = () => setSetting(o.key, val); seg.appendChild(b);
    }
    box.appendChild(g);
  }
  const rows = []; const d = new Date();
  for (let i = 0; i < 7; i++) { const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i), s = store.days[dayKey(dt)]; rows.push(`<tr><td>${dt.toLocaleDateString(LM().locale, { weekday: 'short', day: 'numeric' })}</td><td>${s ? Math.round(s.sec / 60) : 0} ${t('unit.min')}</td><td>${s ? s.gems : 0}</td><td>${s ? exTotal(s) : 0}</td></tr>`); }
  $('#progress').innerHTML = `<table class="prog"><tr><th>${t('th.day')}</th><th>${t('th.moving')}</th><th>${t('th.jewels')}</th><th>${t('th.ex')}</th></tr>${rows.join('')}</table>`;
}
function setSetting(key, val) {
  SETTINGS[key] = val; store.settings = { ...(store.settings || {}), [key]: val }; saveStore();
  if (key === 'lang') { voiceObj = null; try { speechSynthesis.cancel(); } catch (e) {} applyLang(); return; }
  if (key === 'steady') smoother.setLevel(val);
  if (key === 'gems' && grid.length) makeBoard();
  if (key === 'voice' && !val) { try { speechSynthesis.cancel(); } catch (e) {} }
  if (key === 'control') { if (val === 'arm') ensurePose(); if (S.camOn && (S.mode === 'play' || S.mode === 'calibrate')) { P.wasAbsent = true; startCalibrate(); } }
  if (key === 'pick' && val === 'kiss' && S.camOn && !S.models.face) toast(t('t.facepick'));
  if (key === 'pick' && SETTINGS.control === 'hand' && S.camOn && (S.mode === 'play' || S.mode === 'calibrate')) { P.wasAbsent = true; startCalibrate(); }   // the pointer follows a different part of the hand in grab mode
  if (key === 'loud') { if (val && S.camOn && !MIC.on) startMic().catch(() => toast(t('t.mic2'))); else if (!val) stopMic(); }
  if (key === 'arms' && val && S.camOn) ensurePose(true);
  if (key === 'handPlay') { H.wantSeen = performance.now(); H.fb = false; H.lm = null; if (val === 'right' || val === 'left') S.activeHand = val; if (S.camOn && SETTINGS.control === 'hand' && (S.mode === 'play' || S.mode === 'calibrate')) { P.wasAbsent = true; startCalibrate(); } }
  if (key === 'faces' && S.mode === 'play') S.glow = Math.min(S.glow, .9);
  refreshSettingsUI();
}
let settingsOpener = null;
function openSettings(open) {
  const el = $('#settings'); const show = open == null ? el.classList.contains('hidden') : open;
  if (show === !el.classList.contains('hidden')) return;
  el.classList.toggle('hidden', !show); S.hold = show || S.paused; $('#gear').setAttribute('aria-expanded', show);
  if (show) { settingsOpener = document.activeElement; refreshSettingsUI(); $('#closeSettings').focus(); }
  else if (settingsOpener && settingsOpener.focus && !settingsOpener.classList.contains('hidden')) { settingsOpener.focus(); }
}
function recentre() { if (P.present && SETTINGS.control !== 'mouse') { cal.cx = P.rx; cal.cy = P.ry; smoother.reset(.5, .5); P.u = P.v = .5; toast(t('t.centred'), 3000); } else toast(t('t.nocentre'), 3000); }
function toggleFullscreen() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} }

$('#begin').onclick = begin;
$('#openSettings').onclick = () => openSettings(true);
$('#closeSettings').onclick = () => openSettings(false);
$('#gear').onclick = () => openSettings();
$('#fs').onclick = toggleFullscreen;
$('#btnCentre').onclick = recentre;
$('#btnRecal').onclick = () => { openSettings(false); if (S.camOn) { P.wasAbsent = true; startCalibrate(); } else toast(t('t.nocam'), 3000); };
addEventListener('keydown', e => {
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 's') openSettings();
  else if (k === 'escape') openSettings(false);
  else if (k === 'f') toggleFullscreen();
  else if (k === 'c') recentre();
  else if (k === 'm') { SETTINGS.control = 'mouse'; toast(t('t.mouse'), 2500); refreshSettingsUI(); if (S.mode === 'calibrate') finishCalibrate(true); }
  else if (k === ' ' && S.mode !== 'menu' && S.mode !== 'loading') { e.preventDefault(); S.paused = !S.paused; S.hold = S.paused || !$('#settings').classList.contains('hidden'); }
});
cv.addEventListener('pointermove', e => { P.mu = (e.clientX - bx) / bs; P.mv = (e.clientY - by) / bs; });
cv.addEventListener('pointerdown', e => {
  Snd.init(); const x = e.clientX, y = e.clientY; if (S.hold) return;
  for (const b of S.buttons) if (b.x != null && (!b.show || b.show()) && (!b.enabled || b.enabled()) && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }

addEventListener('resize', layout);

// Main loop
// =====================================================================
let lastT = performance.now();

          else if (S.sinceRest > 300) startRest();

      else if (S.mode === 'calibrate') updateCalibrate(dt, now);
      else if (S.mode === 'rest') S.restT += dt;
      updateButtons(dt);
    }
    draw(now, S.hold ? 0 : dt);
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

// canvas text needs the web fonts fetched up front (the page's own text would otherwise be the only thing asking for them)
try { for (const w of [300, 400, 500, 600, 700]) for (const it of ['', 'italic ']) document.fonts.load(`${it}${w} 20px ${SANS}`); } catch (e) {}
layout(); showWelcome();
requestAnimationFrame(frame);

// handy hooks for testing and for tuning by whoever is helping
window.__glimmer = { S, P, F, H, base, cal, SETTINGS, sel, hov, T, get grid() { return grid; }, get CH() { return CH; },
  setFace(v) { Object.assign(F.v, v); F.lastSeen = performance.now() + 1e9; }, setTurn(t) { F.turn = t; F.lastSeen = performance.now() + 1e9; },
  MIC, Pz, FG, spawnFaceGems, faceGemList, handOpenness, begin, startChallenge, bloom, findMove, findMatches, makeBoard, doSwap, startRest, startDone, enterPlay, setSetting, layout: () => ({ bx, by, bs, cs, panelW }) };
